[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rove"
version = "0.1.0"
description = "A multi-agent coding harness running in the terminal, with autonomous teammates, permission gating, and context compaction."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
rove = "rove.main:main"

[tool.setuptools.packages.find]
where = ["src"]
